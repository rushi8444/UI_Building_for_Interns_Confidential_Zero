<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Omnitrix Footprint Charts</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="light-theme">
    <div class="toolbar-top">
        <div class="toolbar-section">
            <div class="symbol-search">
                <div class="icon-search">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 18 18"><path fill="currentColor" d="M12.5 11h-.79l-.28-.27A6.471 6.471 0 0 0 13 6.5 6.5 6.5 0 1 0 6.5 13c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L17.49 16l-4.99-5zm-6 0C4.01 11 2 8.99 2 6.5S4.01 2 6.5 2 11 4.01 11 6.5 8.99 11 6.5 11z"/></svg>
                </div>
                <select id="symbol-select">
                    <option value="">Waiting for data...</option>
                </select>
            </div>
            <div class="divider"></div>
            <div class="timeframe-selector">
                <select id="timeframe-select">
                    <option value="1">1m</option>
                    <option value="5">5m</option>
                    <option value="15">15m</option>
                    <option value="30">30m</option>
                    <option value="60">1h</option>
                </select>
            </div>
            <div class="divider"></div>
            <div class="mode-selector" id="mode-selector">
                <div class="mode-btn active" data-mode="footprint">Footprint</div>
                <div class="mode-btn" data-mode="vp-fixed">VP Fixed</div>
                <div class="mode-btn" data-mode="vp-anchored">VP Anchored</div>
                <div class="mode-btn" data-mode="heatmap">Heatmap</div>
                <div class="mode-btn" data-mode="cluster">Cluster</div>
            </div>
            <button id="btn-indicators" class="mode-btn" style="margin-left:auto; display:flex; align-items:center; gap:5px;">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><path d="M18.7 8l-5.1 5.2-2.8-2.7L7 14.3"/></svg> Indicators
            </button>
        </div>
        <div class="toolbar-section">
            <div class="theme-toggle" id="theme-toggle" title="Toggle Dark/Light Mode">
                <svg id="theme-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
            </div>
            <div class="divider"></div>
            <div id="status" class="status disconnected">Disconnected</div>
        </div>
    </div>
    <div class="main-content">
        <div class="sidebar-left">
            <div class="tool-btn active" title="Cursor" data-tool="cursor"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3l7.07 16.97 2.51-7.39 7.39-2.51L3 3z"/></svg></div>
            <div class="tool-btn" title="Trend Line" data-tool="trendline"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="7" y1="17" x2="17" y2="7"/></svg></div>
            <div class="tool-btn" title="Horizontal Ray" data-tool="ray"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="12" x2="19" y2="12"/></svg></div>
            <div class="tool-btn" title="Fib Retracement" data-tool="fib"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="4" y1="4" x2="20" y2="4"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="20" x2="20" y2="20"/><circle cx="12" cy="12" r="2"/></svg></div>
            <div class="tool-btn" title="Pen" data-tool="pen"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/><path d="M2 2l7.586 7.586"/><circle cx="11" cy="11" r="2"/></svg></div>
            <div class="tool-btn" title="Clear All Drawings" onclick="activeDrawings=[];draw()"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg></div>
        </div>
        
        <div class="panel-left">
            <div class="panel-header">Session Statistics</div>
            <div class="stat-box">
                <div class="stat-label">Total Volume</div>
                <div class="stat-value" id="stat-vol">0</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Net Delta</div>
                <div class="stat-value" id="stat-delta">0</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Pace of Tape (v/s)</div>
                <div class="stat-value" id="stat-pace">0</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Current VWAP</div>
                <div class="stat-value" id="stat-vwap">0.00</div>
            </div>
        </div>

        <div class="chart-container">
            <canvas id="footprint-canvas"></canvas>
        </div>
        
        <div class="panel-right">
            <div class="panel-header">Smart Tape</div>
            <div class="tape-header">
                <div>Size</div>
                <div>Price</div>
                <div>Time</div>
            </div>
            <div class="tape-container" id="tape-container">
            </div>
        </div>
    </div>

    <!-- Indicator Modal -->
    <div id="indicator-modal" class="modal-overlay" style="display:none;">
        <div class="modal">
            <div class="modal-header">
                <h3>Indicators</h3>
                <button id="close-modal">×</button>
            </div>
            <div class="modal-body">
                <div class="ind-list">
                    <button class="ind-btn" data-type="sma" data-pane="main">Add SMA</button>
                    <button class="ind-btn" data-type="ema" data-pane="main">Add EMA</button>
                    <button class="ind-btn" data-type="bollinger" data-pane="main">Add Bollinger</button>
                    <button class="ind-btn" data-type="cpr" data-pane="main">Add CPR</button>
                    <button class="ind-btn" data-type="rsi" data-pane="lower">Add RSI (Lower Pane)</button>
                    <button class="ind-btn" data-type="cvd" data-pane="lower">Add CVD (Lower Pane)</button>
                    <button class="ind-btn" style="background:#f23645; color:white;" onclick="activeIndicators=[]; bottomPanes=[]; draw(); document.getElementById('indicator-modal').style.display='none';">Clear All Indicators</button>
                </div>
            </div>
        </div>
    </div>
    
    <script src="app.js?v=3"></script>
</body>
</html>
